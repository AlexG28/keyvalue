apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvstore-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kvstore
  template:
    metadata:
      labels:
        app: kvstore
    spec:
      containers:
      - name: kvstore-container
        image: test_key_value:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 2222
        env:
        - name: NODE_ID
          value: "node1"
---
apiVersion: v1
kind: Service
metadata:
  name: kvstore-service
spec:
  type: NodePort
  selector:
    app: kvstore
  ports:
    - protocol: TCP
      port: 2222
      targetPort: 2222