---
# 1) Headless service for internal gossip + raft communication
apiVersion: v1
kind: Service
metadata:
  name: kvstore-headless
spec:
  clusterIP: None
  selector:
    app: kvstore
  ports:
    - name: gossip
      port: 7946
      targetPort: 7946
    - name: raft
      port: 9000
      targetPort: 9000

---
# 2) StatefulSet for the KV store
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kvstore
spec:
  serviceName: kvstore-headless
  replicas: 3
  selector:
    matchLabels:
      app: kvstore
  template:
    metadata:
      labels:
        app: kvstore
    spec:
      containers:
        - name: kvstore
          image: test_key_value:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7946
              name: gossip
            - containerPort: 9000
              name: raft
            - containerPort: 2222
              name: http
          args:
            # Adjust args so pods join cluster automatically
            # - "--join-host=kvstore-0.kvstore-headless.default.svc.cluster.local:7946"
            # - "--node-id=$(POD_NAME)"
            - "--join-host=kvstore-0.kvstore-headless.default.svc.cluster.local"
            - "--gossip-port=7946"
            - "--raft-port=8222"
            - "--node-id=$(POD_NAME)"

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

---
# 3) HTTP services for each pod (direct external access)
apiVersion: v1
kind: Service
metadata:
  name: kvstore-0-http
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: kvstore-0
  ports:
    - name: http
      port: 2222
      targetPort: 2222
      nodePort: 30080  # pick available port

---
apiVersion: v1
kind: Service
metadata:
  name: kvstore-1-http
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: kvstore-1
  ports:
    - name: http
      port: 2222
      targetPort: 2222
      nodePort: 30081

---
apiVersion: v1
kind: Service
metadata:
  name: kvstore-2-http
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: kvstore-2
  ports:
    - name: http
      port: 2222
      targetPort: 2222
      nodePort: 30082
